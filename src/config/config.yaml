# ScholarGuard — single source of truth for all pipeline configuration.
# Loaded once by src/config/settings.py into a typed Settings object that
# every stage reads from. Edit values here, not in the detector source.

# ---------------------------------------------------------------------------
# Detector toggles + per-stage thresholds. Stage 2/3 thresholds are injected
# into their existing DetectorConfig / CrossFigureConfig dataclasses (no
# detector source is edited). Stage 4's internal forensic bands remain at
# their Stage-4-calibrated defaults; the pipeline consumes its verdict.
# ---------------------------------------------------------------------------
detectors:
  copy_move:                        # Stage 2 — duplicated regions within a figure
    enabled: true
    confidence_threshold: 0.45      # >= this => figure flagged "forged"
    ratio_threshold: 0.78           # g2NN generalized Lowe ratio (multi-copy aware)
    min_inliers: 3                  # RANSAC inliers to accept a cluster
    sift_contrast_threshold: 0.008  # low, because figures are smooth
    max_dim: 1600                   # downscale longest side (CPU speed)
    # Content gating (src/preprocessing/panel_segmentation.py): restrict
    # keypoints to continuous-tone panels minus text/scale bars, so
    # legitimate repetition (axis labels, plot markers, scale bars) — which
    # is geometrically identical to forgery and drove the 56.6% real-data
    # false-alarm rate — never reaches the matcher.
    use_analysis_mask: true
    # Noise-residual clone test (src/forensics/residual_similarity.py):
    # multiplies confidence by how strongly the aligned regions share one
    # capture's sensor noise. Independent noise => legitimate look-alike.
    residual_independent_factor: 0.25   # damp verified pair with independent noise
    residual_inconclusive_factor: 0.85  # mild damp when the test can't run
    # Dense-field escalation (src/detectors/dense_cmfd.py): when SIFT finds
    # nothing on a smooth blot/gel, a block-matching tier catches the
    # translate-and-paste duplication keypoints miss. Runs only when the SIFT
    # confidence is below the escalation line, so cost stays off clear hits.
    use_dense_tier: true
    dense_escalate_below: 0.45
    # Confidence model (observed-vs-expected; see copy_move_detector._score).
    # Redesigned 2026-07-11: the old confidence was a weighted sum of raw
    # counts whose correlation term was unbounded (flat-pixel ZNCC drove it
    # past 13 on real figures) and which rewarded sheer quantity of self-
    # similarity. It now scores how SURPRISING the inlier count is vs a chance
    # baseline, damped by how localized and well-correlated the patch is.
    surprise_midpoint: 12.0         # inlier z-score mapping to surprise 0.5
    surprise_width: 5.0             # logistic width of the surprise term
    localization_scale: 0.05        # patch area fraction where localization ~1/e
    localization_floor: 0.4         # a strong, localized hit still counts if
                                    # somewhat spread (loc multiplies in [floor,1])

  cross_figure:                     # Stage 3 — a figure reusing another figure
    enabled: true
    phash_max_distance: 10          # Hamming distance for near-duplicate
    embed_review: 0.85              # embedding-candidate floor
    embed_high: 0.985               # "medium" confidence cutoff
    min_inliers: 10                 # RANSAC inliers to claim region reuse
    min_region_area: 2000           # px^2 of grown reused region
    top_k: 10                       # ANN candidates per query
    # Same content gating + clone test as copy-move, plus a publisher-
    # furniture guard: low-entropy images (logos, license badges, rules)
    # are never matched — they used to duplicate each other EXACTLY and
    # produce guaranteed false reuse flags worth 30 risk points.
    use_analysis_mask: true
    min_content_entropy: 1.0
    residual_independent_factor: 0.25
    residual_inconclusive_factor: 0.85
    # Residual clone test as a VETO, not just a damping factor. Damping scales
    # confidence, so a strong geometric match between two legitimately similar
    # panels (dose-response series, time courses) still cleared the reuse bar
    # with demonstrably independent noise — the dominant remaining false-alarm
    # source once copy-move was gated. Two captures never share a noise field,
    # so an INDEPENDENT verdict means look-alike, not copy. INCONCLUSIVE is
    # deliberately NOT vetoed: heavy JPEG destroys the residual, and treating
    # "cannot tell" as "not a clone" would silently drop real reuse.
    residual_veto_independent: true
    # Optional external corpus of prior figures to check against. If null,
    # the paper's OWN figures form the corpus (catches within-paper reuse).
    corpus_dir: null

  splice:                           # Splicing — a region pasted from another source
    enabled: true
    # A block is flagged only when BOTH a foreign sensor-noise level AND a
    # foreign compression fingerprint (JPEG-ghost/ELA) agree on it — the
    # signature of a paste from a different capture. Catches the dominant real
    # fraud mode that copy-move (within-figure) and cross-figure (whole-figure)
    # both miss. See src/forensics/splice_detection.py.
    min_flagged_frac: 0.02          # fraction of textured blocks flagged to fire
    min_flagged_blocks: 4           # and at least this many blocks

  ai_generation:                    # Stage 4 — GAN/diffusion-generated figures
    enabled: true
    # Optional fine-tuned classifier weights. If the file is absent the
    # pipeline runs on frequency + noise forensics only and says so.
    weights_path: src/models/weights/artifact_classifier.pt
    # ⚠ THE TWO THRESHOLDS BELOW ARE INERT WHILE condition_on_compression IS
    # TRUE (the default). The detector then derives its bands from the matching
    # compression_baselines entry (mean+2sd / mean+3sd) and overwrites whatever
    # is set here. They apply ONLY with condition_on_compression: false. The
    # pipeline now says so in its warnings rather than ignoring them silently.
    #
    # Forensic-score bands, RECALIBRATED 2026-07-11 on the real eval set.
    # Real clean PMC figures score forensic mean 0.357, sd 0.107 (n=83); the
    # old synthetic-tuned 0.35 line sat at that mean and fired on ~half of them
    # (FPR 0.518). These bands are ~mean+2sd (suspicious) and ~mean+3sd
    # (likely_ai) — "flag only when unusually far above the real baseline".
    # ⚠ Tuned ON the eval set (only real data available) -> post-fix FPR is
    # OPTIMISTIC, not unbiased. Recalibrate on a fresh real set. See README.
    forensic_suspicious_threshold: 0.57
    forensic_ai_threshold: 0.68
    # Compression-conditioned baselines (preferred over the absolute bands
    # above): each image is z-scored against real figures at SIMILAR JPEG
    # compression, so publisher compression stops masquerading as an AI tell.
    # Flag at z>=2 (suspicious) / z>=3 (likely_ai). Set condition_on_compression
    # false to use the fixed thresholds instead.
    # ⚠ PROVISIONAL means/stds — re-measure on a fresh figure set (and after
    # any change to the frequency/noise sub-scores). See README.
    condition_on_compression: true
    compression_baselines:
      high_compression: {mean: 0.357, std: 0.107}   # JPEG'd publisher figures
      # RECALIBRATED on native PMC-package clean figures (n=373, held-out run):
      # they score forensic mean 0.40, sd 0.057 — NOT the 0.20 of the old
      # synthetic sample. The stale 0.20 baseline made native figures score
      # ~2 sd "too synthetic" and drove the AI per-figure FPR to 12.1%; the
      # measured baseline brings it back to 2.9%. (Measured on the held-out
      # set, so re-validate on a fresh native set — same overfitting caveat.)
      low_compression: {mean: 0.40, std: 0.057}      # native (uncompressed) captures

  claim_consistency:                # Stage 5 — text claims vs. figure content
    enabled: true
    panel_count_tolerance: 0.5      # fractional slack before flagging a count gap
    # Attach the figure image to the Claude call so it counts panels/lanes by
    # SEEING them (multimodal), replacing the coarse classical-CV heuristic as
    # the primary observation. Set false to force the CV-only path.
    use_vision_observation: true

# ---------------------------------------------------------------------------
# LLM (Claude API) settings for claim extraction. The API KEY is read from the
# ANTHROPIC_API_KEY environment variable (or a .env file) — never stored here.
# ---------------------------------------------------------------------------
llm:
  model: claude-opus-4-8
  max_retries: 3
  timeout_seconds: 60

# ---------------------------------------------------------------------------
# Efficiency: skip the expensive LLM claim-extraction call for a figure when
# the (cheap) image forensics already put it at/above the configured risk
# category — the paper is already flagged, so the marginal value is low. This
# is DOCUMENTED and REPORTED per figure (status "skipped_optimization"), never
# silent. Set enabled=false to always run every check.
# ---------------------------------------------------------------------------
optimization:
  skip_llm_when_image_risk: true
  skip_llm_at_category: critical    # low | moderate | high | critical

# ---------------------------------------------------------------------------
# Risk scoring. Per-figure score is 0-100: each detector contributes up to its
# weight (weights sum to 100, so a figure that maxes every signal scores 100).
# Documented in src/pipeline/risk_scorer.py.
# ---------------------------------------------------------------------------
risk_scoring:
  weights:                          # max points each detector adds (sum = 100)
    # Reweighted after the held-out likelihood-ratio analysis: copy-move barely
    # discriminates at the paper level (LR 1.19) so its weight is reduced;
    # splice is a strong new fraud-mode signal and gets real weight.
    #
    # SPLICE DEMOTION TRIED AND REVERTED, 2026-07-26. Figure-level labels showed
    # splice's recall is 0.020 / 0.017 on the two held-out sets — it fires on
    # about one figure in fifty of those it should — so its 20 points were moved
    # to AI-generation (paper-level LR 4.33, the only detector measured to
    # discriminate) and claim-consistency, leaving splice as a lead-only signal.
    #
    # Measured on both sets, that made things WORSE: average precision fell on
    # each (0.690 -> 0.661 and 0.567 -> 0.554) and leave-one-out accuracy on set
    # 1 collapsed (0.700 -> 0.512). Reverted. The likeliest reading is that
    # splice's points are rarely awarded but well targeted when they are — its
    # figure-level precision is the highest of any detector — so the 20 points
    # buy more than their firing rate suggests. Low recall is a reason to
    # improve its sensitivity, not to stop trusting the few calls it makes.
    copy_move: 25
    cross_figure: 25
    splice: 20
    ai_generation: 20
    claim_consistency: 10
  # Severity multipliers for signal sub-types (applied to the weight).
  cross_figure_severity:
    exact_duplicate: 1.0
    region_reuse: 0.9
    visual_similar_only: 0.0        # embedding-only leads don't score alone
  ai_generation_severity:
    likely_ai_generated: 1.0
    suspicious: 0.5
    likely_real: 0.0
  # Paper score = max_figure_weight * worst_figure + mean_figure_weight * mean.
  # Worst figure dominates so one clearly-forged figure isn't diluted by clean ones.
  paper_aggregation:
    max_figure_weight: 0.7
    mean_figure_weight: 0.3
  # Score -> category. A figure/paper gets the highest category whose
  # threshold it meets or exceeds. `moderate` (25) is the screening trigger:
  # a paper at or above it is surfaced as a lead for human review.
  #
  # REAL-DATA CALIBRATION — 2026-07-11, N=15 retracted-fraud / N=10 clean PMC-OA.
  # Deliberately LEFT UNCHANGED at 25, and here is the honest reason.
  #
  # BEFORE the 2026-07-11 detector fixes, fraud and clean paper scores were
  # INVERTED (fraud median 56.3 < clean median 62.2). AFTER the fixes (copy-move
  # confidence redesign + AI-generation recalibration; see real_data_run_v2) the
  # inversion is essentially gone (fraud median 47.0 vs clean 47.6, gap -0.7) and
  # the false-positive count fell 126 -> 72 — a real improvement. BUT the
  # distributions still OVERLAP almost entirely: the best accuracy achievable at
  # ANY single cutoff is 0.60, exactly the 15/25 base rate. No threshold
  # separates real fraud from real clean papers yet.
  #
  # So we keep 25 for high-recall triage rather than chase a flattering cutoff.
  # The auto-sweep pick (67.5 before, 22.5 after) swings with noise and would
  # trade recall for a fake-precise "zero-FP" that rests on only 10 controls
  # (95% Wilson upper bound on FPR ~0.28). The residual problem is detector
  # FALSE-POSITIVE RATE on real figures — copy_move still 0.57 (legit repeated
  # structure: scale bars, replicate panels, geometrically identical to a copy)
  # and cross_figure 0.28 (untouched) — NOT the cutoff.
  # RECALIBRATE with a larger, figure-annotated real set before trusting any
  # numeric threshold change. See the "How honest is it?" section of README.md.
  #
  # STILL 25, and still deliberately — 2026-07-25, Stage 2e (30 fraud / 50 clean
  # held out). These boundaries are shared by every deployment, and nothing fitted
  # to the test set is shipped in them. Two measured findings for anyone changing
  # them:
  #
  #   * If you load AI classifier weights, the score distribution shifts UP and
  #     this cutoff becomes effectively looser: the LOOCV-selected cutoff moves
  #     25.8 -> 36.1, and scoring the blended run at 25 costs precision
  #     (0.600 -> 0.568) and raises paper FPR (0.280 -> 0.320). 27.5 restores
  #     parity at identical recall. See eval_config_heldout_classifier.yaml.
  #   * 25 remains right for the shipped forensics-only path: it is that score's
  #     F1 maximum (0.646) and its LOOCV-modal cutoff (25.8).
  categories:
    low: 0
    moderate: 25
    high: 50
    critical: 75

# ---------------------------------------------------------------------------
# Evidence fusion (additive probabilistic layer over the point score).
# Combines detectors by calibrated LIKELIHOOD RATIOS so a detector whose fire
# rate is nearly the same on fraud and clean papers is discounted
# automatically (LR ~ 1 => ~0 evidence), instead of always adding its fixed
# weight. Produces a per-figure fraud probability; papers aggregate by
# noisy-OR. See src/pipeline/evidence_fusion.py.
#
# calibration.*.p_fire_{fraud,clean} MUST be estimated on held-out data
# (src.evaluation.metrics.estimate_fire_calibration + LOOCV) — the defaults
# below are deliberately weak (LRs near 1) so an uncalibrated install cannot
# over-claim. `prior` is the fraud base rate among screened papers.
# ---------------------------------------------------------------------------
evidence_fusion:
  # ⚠ These values are DUPLICATED in src/pipeline/evidence_fusion.py
  # (DEFAULT_CALIBRATION / DEFAULT_PRIOR), which applies when no settings are
  # passed. Update both together; tests/test_fusion_calibration_sync.py fails
  # if they drift apart.
  # Per-FIGURE prior of manipulation (low on purpose — most figures are
  # genuine even in fraud papers, and the paper-level noisy-OR compounds
  # across figures). Calibrate on data before trusting the posterior.
  prior: 0.12
  calibration:
    copy_move:         {p_fire_fraud: 0.55, p_fire_clean: 0.30}
    cross_figure:      {p_fire_fraud: 0.45, p_fire_clean: 0.20}
    splice:            {p_fire_fraud: 0.35, p_fire_clean: 0.08}
    ai_generation:     {p_fire_fraud: 0.40, p_fire_clean: 0.10}
    claim_consistency: {p_fire_fraud: 0.50, p_fire_clean: 0.15}

# ---------------------------------------------------------------------------
# Output + logging.
# ---------------------------------------------------------------------------
paths:
  output_dir: outputs/stage6_results

logging:
  level: INFO                       # DEBUG | INFO | WARNING | ERROR
