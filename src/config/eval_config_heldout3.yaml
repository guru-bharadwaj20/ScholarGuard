# ScholarGuard — HELD-OUT set 3: the FROZEN confirmation set.
#
# Sets 1 and 2 have both informed decisions by now (the splice demotion, the
# AI classifier, the decision cutoff), so neither is a clean test any more —
# they are calibration data. Set 3 was downloaded specifically to settle the
# figure-count-confound work and MUST be run exactly once per claim, after the
# change being tested is final. Papers are disjoint from sets 1 and 2 and from
# the 25-paper calibration set (fraud excluded by DOI/PMCID; clean drawn from a
# fresh PubMed sample, every candidate screened against the full Retraction
# Watch DOI list and dropped if its DOI could not be resolved).
#
# Report the THRESHOLD-FREE metrics, the figure-count-matched AUC, and the
# leave-one-out accuracy — not the swept best-threshold accuracy.

pipeline_config: src/config/config.yaml

evaluation_set:
  labels_path: data/heldout3_packages/labels.json

output:
  dir: outputs/heldout3_run

decision:
  paper_score_threshold: 25.0

detector_fire_rules:
  copy_move: forged_true
  cross_figure: any_reuse
  ai_generation: not_real
  claim_consistency: inconsistent

threshold_sweep:
  start: 0.0
  stop: 100.0
  step: 2.5

error_analysis:
  max_examples_per_category: 15
